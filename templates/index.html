<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Latent Space Explorer</title>

  <link rel="stylesheet" href="/static/visualizer_style.css" />

  <!-- librerie -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.plot.ly/plotly-2.29.1.min.js"></script>
</head>
<body>
  <header><h1>Latent Space Explorer</h1></header>

  <!-- LAYOUT: sidebar sinistra (sticky) + area grafici -->
  <div class="layout">
    <aside id="sidebar">
      <section id="controls">
        <!-- Input -->
        <fieldset>
          <legend>Input</legend>
          <label for="input-source">Source</label>
          <select id="input-source">
            <option value="keyboard" selected>Keyboard</option>
            <option value="mouse">Mouse</option>
            <option value="osc">OSC</option>
          </select>
        </fieldset>

        <!-- Presets -->
        <fieldset>
          <legend>Presets</legend>
          <label for="preset-select">Preset</label>
          <select id="preset-select"></select>
        </fieldset>

        <!-- 2D/3D -->
        <div id="single-axis-controls">
          <fieldset>
            <legend>Axes (2D/3D)</legend>
            <label>x <select id="axis-x"></select></label>
            <label>y <select id="axis-y"></select></label>
            <label class="z-only">z <select id="axis-z"></select></label>
          </fieldset>
        </div>

        <!-- 4D -->
        <div id="dual-axis-controls" style="display:none">
          <fieldset>
            <legend>View A</legend>
            <label>x <select id="axis-a-x"></select></label>
            <label>y <select id="axis-a-y"></select></label>
          </fieldset>
          <fieldset>
            <legend>View B</legend>
            <label>x <select id="axis-b-x"></select></label>
            <label>y <select id="axis-b-y"></select></label>
          </fieldset>
        </div>

        <!-- Shortcuts: markup STATICO; visibilità via data-attr + CSS -->
        <fieldset id="shortcuts" data-mode="other" data-dim="2">
          <legend>Shortcuts</legend>

          <!-- 2D -->
          <div class="shortcut-set" data-dim="2">
            <div class="shortcut-title">Move</div>
            <div class="shortcut-keys" aria-label="Move in 2D">
              <span class="kbd">A</span><span class="sep">/</span><span class="kbd">D</span>
              <span class="kbd">W</span><span class="sep">/</span><span class="kbd">S</span>
            </div>
          </div>

          <!-- 3D -->
          <div class="shortcut-set" data-dim="3">
            <div class="shortcut-title">Move XY</div>
            <div class="shortcut-keys" aria-label="Move on X and Y">
              <span class="kbd">A</span><span class="sep">/</span><span class="kbd">D</span>
              <span class="kbd">W</span><span class="sep">/</span><span class="kbd">S</span>
            </div>
          </div>
          <div class="shortcut-set" data-dim="3">
            <div class="shortcut-title">Move Z</div>
            <div class="shortcut-keys" aria-label="Move on Z">
              <span class="kbd">Q</span><span class="sep">/</span><span class="kbd">E</span>
            </div>
          </div>

          <!-- 4D -->
          <div class="shortcut-set" data-dim="4">
            <div class="shortcut-title">View A</div>
            <div class="shortcut-keys" aria-label="Move View A">
              <span class="kbd">A</span><span class="sep">/</span><span class="kbd">D</span>
              <span class="kbd">W</span><span class="sep">/</span><span class="kbd">S</span>
            </div>
          </div>
          <div class="shortcut-set" data-dim="4">
            <div class="shortcut-title">View B</div>
            <div class="shortcut-keys" aria-label="Move View B">
              <span class="kbd">F</span><span class="sep">/</span><span class="kbd">H</span>
              <span class="kbd">T</span><span class="sep">/</span><span class="kbd">G</span>
            </div>
          </div>

          <!-- Nota comune -->
          <div class="shortcut-note" data-dim="any">
            <span class="kbd">Shift</span><span>coarse</span>
            <span class="kbd">Alt</span><span>fine</span>
          </div>
        </fieldset>
      </section>
    </aside>

    <main id="plots">
      <!-- In 2D/3D il JS usa solo il sinistro (centrato e grande); in 4D entrambi -->
      <div id="plot-left"  class="plot"></div>
      <div id="plot-right" class="plot"></div>
    </main>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
